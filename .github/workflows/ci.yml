name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: API
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          npm run typecheck
          npm test
      - name: Web
        working-directory: web
        run: |
          npm ci
          npm run build
